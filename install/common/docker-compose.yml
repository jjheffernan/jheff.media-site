# Production stack (Mongo bundled; Immich optional via env).
# Multi-app LXC: unique container_name + volume keys (jheffmedia-*). Do not set
# top-level `name:` here — it would orphan existing `common_jheffmedia-*` volumes.

services:
  application:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        YEW_FULLSTACK_BUILD_ID: ${YEW_FULLSTACK_BUILD_ID:-}
    image: jheffmedia/application:latest
    container_name: jheffmedia-application
    restart: unless-stopped
    # Non-root (matches Dockerfile USER / host SERVICE_UID). Never mount docker.sock here.
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file:
      - .env.production
    environment:
      # Always listen on all interfaces *inside* the container. Do not use ${HOST} —
      # shells/systemd often set HOST to the hostname, which binds loopback-only and
      # breaks Docker port publishing from outside the LXC.
      YEW_FULLSTACK_HOST: "0.0.0.0"
      YEW_FULLSTACK_PORT: ${HTTP_PORT:-8080}
      YEW_FULLSTACK_DB_CONNSTR: ${DB_CONNSTR}
      YEW_FULLSTACK_DB_NAME: ${DB_NAME}
      YEW_FULLSTACK_JWT_SECRET_FILE: /run/secrets/jwt_secret
      YEW_FULLSTACK_BUILD_ID: ${YEW_FULLSTACK_BUILD_ID:-}
      # Host deploy control (Admin → Dev → Deploy). Bind-mounted; no docker.sock in app.
      YEW_FULLSTACK_DEPLOY_CTL: /data/deploy-ctl
      # Comma-separated browser origins (e.g. https://jheff.media or http://IP:PORT).
      YEW_FULLSTACK_CORS_ORIGINS: ${YEW_FULLSTACK_CORS_ORIGINS:-}
      YEW_FULLSTACK_FEED_PROVIDER: ${FEED_PROVIDER:-none}
      YEW_FULLSTACK_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      YEW_FULLSTACK_FEED_STATIC_JSON: ${FEED_STATIC_JSON:-}
      YEW_FULLSTACK_IMMICH_URL: ${IMMICH_URL:-}
      YEW_FULLSTACK_IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      YEW_FULLSTACK_IMMICH_ALBUM_ID: ${IMMICH_ALBUM_ID:-}
      YEW_FULLSTACK_IMMICH_SHARED_KEY: ${IMMICH_SHARED_KEY:-}
      YEW_FULLSTACK_ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      YEW_FULLSTACK_CONTENT_UPLOAD_DIR: /data/content-uploads
    volumes:
      - ../../backend/src/secret.key:/run/secrets/jwt_secret:ro
      - jheffmedia-content-uploads:/data/content-uploads
      # Drop-file bridge for Admin GUI update (host systemd path → jheffmedia --update).
      - ../../var/deploy:/data/deploy-ctl
    ports:
      # Override HTTP_BIND=127.0.0.1 when a reverse proxy on the same LXC terminates TLS.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  db:
    image: docker.io/library/mongo:7.0
    container_name: jheffmedia-database
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Mongo is NOT published to the host — only reachable on the Compose network.
    environment:
      # Official mongo image vars are MONGO_INITDB_* (not MONGODB_INITDB_*).
      # Wrong prefix → no root user → healthcheck UserNotFound → db unhealthy forever.
      MONGO_INITDB_DATABASE: ${DB_NAME:-jheffmedia}
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
      # Healthcheck auth (same secret). INITDB only runs on an *empty* data volume.
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    volumes:
      - jheffmedia-mongo:/data/db
    healthcheck:
      # Auth ping via container env ($$ → $). Fails when .env password ≠ volume → use
      # `jheffmedia --reset-db` (or restore the original MONGO_PASSWORD).
      test:
        [
          "CMD-SHELL",
          "mongosh -u root -p \"$$MONGO_PASSWORD\" --authenticationDatabase admin --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'",
        ]
      interval: 5s
      timeout: 8s
      retries: 18
      start_period: 40s

volumes:
  jheffmedia-mongo:
  jheffmedia-content-uploads:
