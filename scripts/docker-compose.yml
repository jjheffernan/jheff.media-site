services:
  application:
    image: "jheffmedia/application"
    container_name: "jheffmedia-application"
    environment:
      - "YEW_FULLSTACK_HOST=0.0.0.0"
      - "YEW_FULLSTACK_PORT=8080"
      - "YEW_FULLSTACK_DB_CONNSTR=mongodb://root:password@db:27017/jheffmedia?authSource=admin"
      - "YEW_FULLSTACK_DB_NAME=jheffmedia"
      - "YEW_FULLSTACK_JWT_SECRET_FILE=/run/secrets/jwt_secret"
      - "YEW_FULLSTACK_CONTENT_UPLOAD_DIR=/data/content-uploads"
    volumes:
      - "../backend/src/secret.key:/run/secrets/jwt_secret:ro"
      - "jheffmedia-content-uploads:/data/content-uploads"
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: "docker.io/library/mongo:7.0"
    container_name: "jheffmedia-database"
    environment:
      - MONGODB_INITDB_DATABASE=jheffmedia
      - MONGODB_INITDB_ROOT_USERNAME=root
      - MONGODB_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017"

  prometheus:
    image: "docker.io/prom/prometheus:v2.55.1"
    container_name: "jheffmedia-prometheus"
    volumes:
      - "./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: "docker.io/grafana/grafana:11.4.0"
    container_name: "jheffmedia-grafana"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "./observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  jheffmedia-content-uploads:
